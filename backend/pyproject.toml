[project]
name = "documentation-digester"
version = "0.1.0"
authors = [
    { name = "Thomas ☻", email = "53582981+tthn0@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
start = "documentation_digester:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
