name: documentation-digester-backend
services:
  documentation-digester-backend:
    container_name: documentation-digester-backend
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@host.docker.internal:5432/documentation_digester
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_LLM_MODEL: qwen2.5:1.5b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text:latest
    ports:
      - 8000:8000
    volumes:
      - ./data:/app/data
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./uv.lock
